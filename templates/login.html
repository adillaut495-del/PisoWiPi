<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PisoPilot | Sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body class="login-body">
  <main class="login-shell">
    <p class="eyebrow">PISOPILOT / ADMIN ACCESS</p>
    <h1>Keep the machine moving.</h1>
    <p class="muted">Sign in to manage sales, access plans, connected clients, and hardware.</p>
    <form method="post" class="login-form">
      {% if error %}<div class="alert">{{ error }}</div>{% endif %}
      <label for="username">Username</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">Enter console</button>
    </form>
    
  </main>
</body>
</html>
